<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.account-card');
        const continueBtn = document.getElementById('continue-btn');
        let selectedType = null;

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Reset all cards
                cards.forEach(c => {
                    c.setAttribute('aria-pressed', 'false');
                    c.classList.remove('ring-2', 'ring-primary', 'bg-primary-fixed/20');
                    c.classList.add('bg-surface-container-lowest');
                    const circle = c.querySelector('.check-circle');
                    const icon = c.querySelector('.check-icon');
                    circle.classList.remove('bg-primary', 'border-primary');
                    circle.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                    icon.classList.remove('opacity-100');
                    icon.classList.add('opacity-0');
                });

                // Set active card
                card.setAttribute('aria-pressed', 'true');
                card.classList.add('ring-2', 'ring-primary', 'bg-primary-fixed/20');
                card.classList.remove('bg-surface-container-lowest');
                const activeCircle = card.querySelector('.check-circle');
                const activeIcon = card.querySelector('.check-icon');
                activeCircle.classList.add('bg-primary', 'border-primary');
                activeCircle.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                activeIcon.classList.add('opacity-100');
                activeIcon.classList.remove('opacity-0');

                // Enable continue button
                selectedType = card.dataset.type;
                continueBtn.disabled = false;
            });
        });
        
        continueBtn.addEventListener('click', () => {
            if(selectedType) {
                console.log(`Proceeding to registration for: ${selectedType}`);
                // Add navigation logic here based on selectedType
            }
        });
    });
