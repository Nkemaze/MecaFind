services:
  - type: web
    name: mecafind-api
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mecafind-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: mecafind-db
    plan: free
    databaseName: mecafind
    user: mecafind
